name: quarto_standalone
description: Single Quarto document via write_quarto()

variants:
  default:
    when: { example: null }
    files:
      - src: analysis/default_quarto.qmd
        dst: "{filename}"
        inject: { knitr_opts: supporting/partials/knitr_analysis.yml }

  example:
    when: { example: true }
    files:
      - src: analysis/analysis_qmd_with_example.qmd
        dst: "{filename}"
        inject: { knitr_opts: supporting/partials/knitr_analysis.yml }
      - { src: styling/custom.scss, dst: custom.scss }
      - { src: supporting/apa.csl, dst: bib/apa.csl }
      - { src: supporting/mla.csl, dst: bib/mla.csl }
      - src: supporting/the-new-england-journal-of-medicine.csl
        dst: bib/the-new-england-journal-of-medicine.csl
    actions:
      - { type: create_bib, path: bib }

  no_example:
    when: { example: false }
    files:
      - src: analysis/analysis_qmd_wo_example.qmd
        dst: "{filename}"
        inject: { knitr_opts: supporting/partials/knitr_analysis.yml }
      - { src: styling/custom.scss, dst: custom.scss }
      - { src: supporting/apa.csl, dst: bib/apa.csl }
      - { src: supporting/mla.csl, dst: bib/mla.csl }
      - src: supporting/the-new-england-journal-of-medicine.csl
        dst: bib/the-new-england-journal-of-medicine.csl
    actions:
      - { type: create_bib, path: bib }
